# Image-baked pinned pytest configuration (modeled on illya-nau/GAS/config/gates/pytest.pinned.ini)
# Mounted at /opt/pinned/pytest.pinned.ini (root:root, 0644) outside /workspace and invoked with
# --rootdir=. --override-ini=addopts= -c /opt/pinned/pytest.pinned.ini so a branch cannot inject
# -k/-m deselection flags or tamper with test discovery.
[pytest]
pythonpath = .
testpaths = tests
norecursedirs = scratch venv .venv .git .claude
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --tb=short -q
markers =
    integration: talks to a live BigQuery backend; deselect with -m "not integration"
