substitutions:
  _REGION: us-central1
  _SERVICE: bq-finops-optimizer
  _REPOSITORY: bq-finops-optimizer
  _IMAGE: app
  _RUNTIME_SA: ''

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SA="${_RUNTIME_SA}"
        if [ -z "$$SA" ]; then
          SA="bq-finops-optimizer-runtime@$${PROJECT_ID}.iam.gserviceaccount.com"
        fi
        gcloud run deploy ${_SERVICE} \
          --project=$$PROJECT_ID \
          --region=${_REGION} \
          --image=${_REGION}-docker.pkg.dev/$$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$$BUILD_ID \
          --service-account="$$SA" \
          --no-allow-unauthenticated \
          --set-env-vars=AUTH_ENFORCED_UPSTREAM=true \
          --memory=2Gi \
          --cpu=2 \
          --timeout=3600 \
          --port=8080

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
