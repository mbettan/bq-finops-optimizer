<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — BQ FinOps Optimizer</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="https://mbettan.github.io/bq-finops-optimizer/static/favicon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: #0a0e1a;
            color: #e2e8f0;
            font-family: 'Inter', system-ui, sans-serif;
            text-align: center;
            padding: 2rem;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 600px 400px at 30% 20%, rgba(56, 189, 248, 0.08), transparent),
                radial-gradient(ellipse 500px 350px at 70% 70%, rgba(168, 85, 247, 0.06), transparent);
            z-index: 0;
        }
        .error-container {
            position: relative; z-index: 1;
            max-width: 540px;
        }
        .error-code {
            font-family: 'Sora', sans-serif;
            font-size: clamp(5rem, 15vw, 9rem);
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-family: 'Sora', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #e2e8f0;
        }
        p {
            font-size: 1rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem; font-weight: 600;
            color: #0a0e1a;
            background: linear-gradient(135deg, #38bdf8, #06b6d4);
            border: none; border-radius: 12px;
            padding: 0.85rem 2rem;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 24px rgba(56, 189, 248, 0.25);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(56, 189, 248, 0.35);
        }
        .btn-outline {
            background: transparent;
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: none;
            margin-left: 0.75rem;
        }
        .btn-outline:hover {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 4px 16px rgba(56, 189, 248, 0.1);
        }
        .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.75rem; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code" aria-hidden="true">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or may have moved. Let's get you back to optimizing BigQuery costs.</p>
        <div class="actions">
            <a href="https://mbettan.github.io/bq-finops-optimizer/" class="btn">← Back to Home</a>
            <a href="https://github.com/mbettan/bq-finops-optimizer" class="btn btn-outline" target="_blank" rel="noopener">View on GitHub</a>
        </div>
    </div>
</body>
</html>
